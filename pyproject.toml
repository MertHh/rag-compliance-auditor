[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditor"
version = "0.1.0"
description = "Hybrid RAG compliance auditor"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "sentence-transformers>=4.0",
    "openai>=3.0",
    "ollama>=0.6",
    "langgraph>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.140",
    "uvicorn>=0.50",
    "python-multipart>=0.0.30",
    "httpx>=0.28",
    "streamlit>=1.60",
    "streamlit-pdf-viewer>=0.0.30,<0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ui", "."]
markers = ["slow: downloads and runs real models"]
addopts = "-m 'not slow'"
filterwarnings = [
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
